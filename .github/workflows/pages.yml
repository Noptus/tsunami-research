name: Publish research ledger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tsunamiresearch-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests
      - name: Verify sources and public issue receipts
        run: python -m tsunami validate --repository "$GITHUB_REPOSITORY"
      - run: python -m tsunami build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - id: publication
        uses: actions/deploy-pages@v4
